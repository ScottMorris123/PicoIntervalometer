<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pico Intervalometer</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1e40af;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f9fafb;
      --surface: #ffffff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 4px 6px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg) 0%, #f3f4f6 100%);
      min-height: 100vh;
    }

    h1 {
      font-size: 1.875rem;
      margin: 0 0 12px 0;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }

    label input[type=checkbox] {
      margin-right: 8px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    input[type=number] {
      width: 100%;
      max-width: 160px;
      padding: 8px 12px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Monaco', 'Courier New', monospace;
      transition: all 0.2s;
    }

    input[type=number]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    #connect {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    #connect:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }

    #connect:active {
      transform: translateY(0);
    }

    #disconnect {
      background: var(--danger);
      color: white;
    }

    #disconnect:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    #read {
      background: var(--surface);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-weight: 600;
    }

    #read:hover {
      background: rgba(59, 130, 246, 0.05);
      transform: translateY(-2px);
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    .status.connected {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .status.disconnected {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .log {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.8rem;
      margin-top: 16px;
      max-height: 180px;
      overflow-y: auto;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      color: #4b5563;
      border: 1px solid var(--border);
      line-height: 1.5;
    }

    .log div {
      padding: 4px 0;
    }

    .log div:not(:last-child) {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    #deviceName {
      font-weight: 600;
      color: var(--primary);
      padding: 8px 12px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 6px;
      min-width: 120px;
      text-align: center;
    }

    #controls {
      margin-top: 16px;
    }

    .control-group {
      background: #f9fafb;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>⏱️ Pico Intervalometer</h1>
  <p class="subtitle">Control your camera's intervalometer via Bluetooth</p>
  <div class="box">
    <div class="section-title">Connection</div>
    <div class="row">
      <button id="connect">🔗 Connect Device</button>
      <button id="disconnect" style="display:none">❌ Disconnect</button>
      <div id="deviceName">No device</div>
    </div>

    <div id="controls" style="display:none">
      <div class="section-title">Settings</div>
      <div class="control-group">
        <label>⏰ Interval (milliseconds)</label>
        <input id="interval" type="number" min="1000" step="100" value="500">
        <small style="color: var(--text-secondary); display: block; margin-top: 4px;">Time between captures</small>
      </div>
      
      <div class="control-group">
        <label>⏳ Delay (milliseconds)</label>
        <input id="delay" type="number" min="0" step="50" value="50">
        <small style="color: var(--text-secondary); display: block; margin-top: 4px;">Delay before capture</small>
      </div>
      
      <div class="control-group">
        <label>
          <input id="enable" type="checkbox">
          <span>🎬 Enable Intervalometer</span>
        </label>
      </div>

      <div class="row">
        <button id="read">🔄 Refresh Values</button>
      </div>
    </div>

    <div class="status disconnected" id="status">Not connected</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const SERVICE = 'fa2c6001-1203-4806-af25-075a06539f45';
    const CHAR_ENABLE = 'fa2c6002-1203-4806-af25-075a06539f45';
    const CHAR_INTERVAL = 'fa2c6003-1203-4806-af25-075a06539f45';
    const CHAR_DELAY = 'fa2c6004-1203-4806-af25-075a06539f45';

    let device, server, service;
    let cEnable, cInterval, cDelay;

    const btnConnect = document.getElementById('connect');
    const btnDisconnect = document.getElementById('disconnect');
    const controls = document.getElementById('controls');
    const status = document.getElementById('status');
    const logEl = document.getElementById('log');
    const deviceName = document.getElementById('deviceName');
    const inpInterval = document.getElementById('interval');
    const inpDelay = document.getElementById('delay');
    const chkEnable = document.getElementById('enable');
    const btnRead = document.getElementById('read');

    function show(s, type='normal'){ 
      status.textContent = s; 
      status.className = 'status';
      if(type === 'connected') status.classList.add('connected');
      else if(type === 'error') status.classList.add('error');
      else if(type === 'disconnected') status.classList.add('disconnected');
      addLog(s) 
    }
    function addLog(s){ 
      const el=document.createElement('div'); 
      el.textContent = new Date().toLocaleTimeString() + ' - ' + s; 
      logEl.prepend(el) 
    }

    async function connect(){
      try{
        show('Scanning for devices...', 'normal');
        device = await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
        device.addEventListener('gattserverdisconnected', onDisconnect);
        deviceName.textContent = device.name || 'Unnamed device';

        show('Connecting...', 'normal');
        server = await device.gatt.connect();
        service = await server.getPrimaryService(SERVICE);

        show('Loading characteristics...', 'normal');
        cEnable = await service.getCharacteristic(CHAR_ENABLE);
        cInterval = await service.getCharacteristic(CHAR_INTERVAL);
        cDelay = await service.getCharacteristic(CHAR_DELAY);

        controls.style.display = '';
        btnDisconnect.style.display = '';
        btnConnect.style.display = 'none';

        show('✅ Connected to ' + (device.name||'device'), 'connected');

        await readAll();

        // Try to receive notifications when values change on device
        try{
          await cEnable.startNotifications();
          cEnable.addEventListener('characteristicvaluechanged', (e)=>{
            const v=new DataView(e.target.value.buffer).getUint8(0); chkEnable.checked=!!v; addLog('Enable changed → '+v)
          });
        }catch(e){ /* not fatal */ }

        chkEnable.addEventListener('change', async ()=>{
          const val = chkEnable.checked?1:0;
          await cEnable.writeValue(new Uint8Array([val]));
          addLog('Wrote enable='+val);
        });

        inpInterval.addEventListener('change', async ()=>{
          const v = parseInt(inpInterval.value)||0;
          const buf = new ArrayBuffer(4); new DataView(buf).setUint32(0,v,true);
          await cInterval.writeValue(new Uint8Array(buf));
          addLog('Wrote interval='+v+'ms');
        });

        inpDelay.addEventListener('change', async ()=>{
          const v = parseInt(inpDelay.value)||0;
          const buf = new ArrayBuffer(4); new DataView(buf).setUint32(0,v,true);
          await cDelay.writeValue(new Uint8Array(buf));
          addLog('Wrote delay='+v+'ms');
        });

        btnRead.addEventListener('click', readAll);

      }catch(e){ show('❌ Error: '+e, 'error'); console.error(e) }
    }

    async function readAll(){
      try{
        const e = await cEnable.readValue();
        const en = e.getUint8(0); chkEnable.checked = !!en;

        const iv = await cInterval.readValue();
        const interval = new DataView(iv.buffer).getUint32(0,true); inpInterval.value = interval;

        const dv = await cDelay.readValue();
        const delay = new DataView(dv.buffer).getUint32(0,true); inpDelay.value = delay;

        show('✅ Values refreshed', 'connected');
      }catch(err){ show('❌ Read error: '+err, 'error'); console.error(err) }
    }

    function onDisconnect(){
      show('📵 Disconnected', 'disconnected');
      controls.style.display = 'none';
      btnDisconnect.style.display = 'none';
      btnConnect.style.display = '';
      deviceName.textContent = 'No device';
    }

    btnConnect.addEventListener('click', ()=>{
      if(!navigator.bluetooth){ show('❌ Web Bluetooth not available', 'error'); return }
      connect();
    });

    btnDisconnect.addEventListener('click', async ()=>{
      if(device && device.gatt && device.gatt.connected) await device.gatt.disconnect();
      onDisconnect();
    });
  </script>
</body>
</html>
